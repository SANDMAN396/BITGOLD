description "BitGold Core Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env BITGOLDD_BIN="/usr/bin/bitgoldd"
env BITGOLDD_USER="bitgold"
env BITGOLDD_GROUP="bitgold"
env BITGOLDD_PIDDIR="/var/run/bitgoldd"
# upstart can't handle variables constructed with other variables
env BITGOLDD_PIDFILE="/var/run/bitgoldd/bitgoldd.pid"
env BITGOLDD_CONFIGFILE="/etc/bitgold/bitgold.conf"
env BITGOLDD_DATADIR="/var/lib/bitgoldd"

expect fork

respawn
respawn limit 5 120
kill timeout 600

pre-start script
    # this will catch non-existent config files
    # bitgoldd will check and exit with this very warning, but it can do so
    # long after forking, leaving upstart to think everything started fine.
    # since this is a commonly encountered case on install, just check and
    # warn here.
    if ! grep -qs '^rpcpassword=' "$BITGOLDD_CONFIGFILE" ; then
        echo "ERROR: You must set a secure rpcpassword to run bitgoldd."
        echo "The setting must appear in $BITGOLDD_CONFIGFILE"
        echo
        echo "This password is security critical to securing wallets "
        echo "and must not be the same as the rpcuser setting."
        echo "You can generate a suitable random password using the following "
        echo "command from the shell:"
        echo
        echo "bash -c 'tr -dc a-zA-Z0-9 < /dev/urandom | head -c32 && echo'"
        echo
        echo "It is recommended that you also set alertnotify so you are "
        echo "notified of problems:"
        echo
        echo "ie: alertnotify=echo %%s | mail -s \"BitGold Alert\"" \
            "admin@foo.com"
        echo
        exit 1
    fi

    mkdir -p "$BITGOLDD_PIDDIR"
    chmod 0755 "$BITGOLDD_PIDDIR"
    chown $BITGOLDD_USER:$BITGOLDD_GROUP "$BITGOLDD_PIDDIR"
    chown $BITGOLDD_USER:$BITGOLDD_GROUP "$BITGOLDD_CONFIGFILE"
    chmod 0660 "$BITGOLDD_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$BITGOLDD_PIDFILE" \
    --chuid $BITGOLDD_USER:$BITGOLDD_GROUP \
    --exec "$BITGOLDD_BIN" \
    -- \
    -pid="$BITGOLDD_PIDFILE" \
    -conf="$BITGOLDD_CONFIGFILE" \
    -datadir="$BITGOLDD_DATADIR" \
    -disablewallet \
    -daemon

